services:
  - type: web
    name: frat-week
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        value: "1289371"
      - key: STARTING_FAAB
        value: 500
      - key: DATABASE_URL
        sync: false
